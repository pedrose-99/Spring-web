<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}"></title>
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1 class="mb-4">Informacion del Cliente</h1>

        <!-- Headers -->
        <h2>Headers</h2>
        <div class="mb-4">
            <table class="table table-striped table-bordered">
                <tr>
                    <th>Navegador</th>
                    <td th:text="${navegador}"></td>
                </tr>
                <tr>
                    <th>Idioma (Header)</th>
                    <td th:text="${idiomaHeader}"></td>
                </tr>
            </table>
        </div>

        <!-- Cookies -->
        <h2>Cookies</h2>
        <div class="mb-4">
            <table class="table table-striped table-bordered">
                <tr>
                    <th>Idioma preferido</th>
                    <td th:text="${idiomaCookie}"></td>
                </tr>
            </table>
            <p class="mt-3">Cambiar idioma:</p>
            <div class="btn-group">
                <a th:href="@{/cliente/idioma(idioma='es')}" class="btn btn-outline-primary">Espanol</a>
                <a th:href="@{/cliente/idioma(idioma='en')}" class="btn btn-outline-primary">Ingles</a>
                <a th:href="@{/cliente/idioma(idioma='fr')}" class="btn btn-outline-primary">Frances</a>
            </div>
        </div>

        <!-- Sesion -->
        <h2>Sesion</h2>

        <!-- Si hay sesion iniciada -->
        <div th:if="${session.userName != null}" class="mb-4">
            <table class="table table-striped table-bordered">
                <tr>
                    <th>Usuario</th>
                    <td th:text="${session.userName}"></td>
                </tr>
                <tr>
                    <th>Rol</th>
                    <td th:text="${session.role}"></td>
                </tr>
            </table>
            <a th:href="@{/cliente/logout}" class="btn btn-danger">Cerrar Sesion</a>
        </div>

        <!-- Si NO hay sesion iniciada -->
        <div th:if="${session.userName == null}" class="mb-4">
            <div class="alert alert-warning">No has iniciado sesion</div>
            <a th:href="@{/cliente/login}" class="btn btn-success">Iniciar Sesion</a>
        </div>

        <!-- Botones de navegacion -->
        <hr>
        <div class="mt-4">
            <a th:href="@{/entrantes/lista}" class="btn btn-primary">Entrantes</a>
            <a th:href="@{/principales/lista}" class="btn btn-success">Principales</a>
            <a th:href="@{/postres/lista}" class="btn btn-warning">Postres</a>
            <a th:href="@{/menus/lista}" class="btn btn-info">Menus</a>
        </div>
    </div>

    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
