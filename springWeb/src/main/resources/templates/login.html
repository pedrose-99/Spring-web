<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1 class="mb-4">Sesión Iniciada</h1>

        <div class="mb-4">
            <table class="table table-striped table-bordered">
                <tr>
                    <th>Usuario</th>
                    <td th:text="${session.userName}"></td>
                </tr>
                <tr>
                    <th>Rol</th>
                    <td th:text="${session.role}"></td>
                </tr>
            </table>
        </div>

        <div class="mb-4">
            <a th:href="@{/cliente/info}" class="btn btn-info">Ir a Info</a>
            <a th:href="@{/cliente/logout}" class="btn btn-danger">Cerrar Sesión</a>
        </div>

        <!-- Botones de navegación -->
        <hr>
        <div class="mt-4">
            <a th:href="@{/entrantes/lista}" class="btn btn-primary">Entrantes</a>
            <a th:href="@{/principales/lista}" class="btn btn-success">Principales</a>
            <a th:href="@{/postres/lista}" class="btn btn-warning">Postres</a>
            <a th:href="@{/menus/lista}" class="btn btn-info">Menus</a>
            <a th:href="@{/cliente/info}" class="btn btn-secondary">Info Cliente</a>
        </div>
    </div>

    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
