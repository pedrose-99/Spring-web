<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}"></title>
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1 th:text="${encabezado}" class="mb-4"></h1>

        <!-- Si existen menus -->
        <div th:if="${menus}">
            <table class="table table-striped table-bordered">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Descripcion</th>
                    <th>Entrante</th>
                    <th>Principal</th>
                    <th>Postre</th>
                    <th>Precio Total</th>
                    <th>Precio con IVA</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="menu : ${menus}">
                    <td th:text="${menu.id}"></td>
                    <td th:text="${menu.nombre}"></td>
                    <td th:text="${menu.descripcion}"></td>
                    <td th:text="${menu.entrante?.nombre}"></td>
                    <td th:text="${menu.principal?.nombre}"></td>
                    <td th:text="${menu.postre?.nombre}"></td>
                    <td th:text="${menu.precio}"></td>
                    <td th:text="${menu.precioConIVA}"></td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Si no existe -->
        <div th:if="${error}">
            <div class="alert alert-danger" th:text="${error}"></div>
        </div>

        <!-- Botones de navegacion -->
        <div class="mt-4">
            <a th:href="@{/entrantes/lista}" class="btn btn-primary">Entrantes</a>
            <a th:href="@{/principales/lista}" class="btn btn-success">Principales</a>
            <a th:href="@{/postres/lista}" class="btn btn-warning">Postres</a>
            <a th:href="@{/menus/lista}" class="btn btn-info">Menus</a>
            <a th:href="@{/cliente/info}" class="btn btn-secondary">Info Cliente</a>
        </div>
    </div>

    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
